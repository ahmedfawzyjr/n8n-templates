name: N8N Templates Validation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Validate JSON Workflows
      run: |
        python -c "
        import os, json, sys
        errors = 0
        for root, dirs, files in os.walk('.'):
            if '.git' in root or 'node_modules' in root:
                continue
            for f in files:
                if f.endswith('.json') and f not in ['package.json', 'package-lock.json', 'vercel.json']:
                    path = os.path.join(root, f)
                    try:
                        with open(path, 'r', encoding='utf-8') as fh:
                            json.load(fh)
                    except Exception as e:
                        print(f'Error parsing {path}: {e}')
                        errors += 1
        if errors > 0:
            sys.exit(1)
        print('All n8n workflow templates are valid JSON!')
        "
